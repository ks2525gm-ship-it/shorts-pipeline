name: Auto Generate and Upload YouTube Shorts

on:
  repository_dispatch:
    types: [generate_video]
  workflow_dispatch:
    inputs:
      product_name:
        description: 'Product Name'
        required: true
        default: '卓上ミニモップ'
      image_url:
        description: 'Image URL'
        required: false
        default: 'https://i.ytimg.com/vi/9z8o3WOhS_c/hqdefault.jpg'
      blog_url:
        description: 'Blog URL'
        required: false
        default: 'https://benrinamonohak.blogspot.com/'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate Short Video
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload || github.event.inputs) }}
        run: |
          python generate_shorts.py

      - name: Upload to YouTube Shorts
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload || github.event.inputs) }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_youtube.py

      - name: Upload Generated Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: final_short.mp4
